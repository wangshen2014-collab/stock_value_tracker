name: Daily Stock Valuation Report

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US market close.
    # 22:30 UTC is around 2:30 PM PST / 3:30 PM PDT.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Generate report
        run: |
          python stock_report.py

      - name: Prepare GitHub Pages latest report
        run: |
          mkdir -p docs
          cp reports/latest.html docs/index.html

      - name: Commit updated reports and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data docs
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update daily stock valuation report"
            git push
          fi
